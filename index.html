<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano360 Virtual Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #panorama { width: 100%; height: 100%; }

        /* Completely neutralize Pannellum's default info hotspot wrapper */
        .pnm-info-hotspot {
            background: none !important;
            background-image: none !important;
            border: none !important;
            box-shadow: none !important;
            width: auto !important;
            height: auto !important;
        }
        .pnm-info-hotspot::after {
            display: none !important;
        }

        @keyframes floatBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .custom-arrow-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            animation: floatBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
            transition: transform 0.2s ease;
        }
        .custom-arrow-container:hover {
            transform: scale(1.1) translateY(-4px);
        }

        .custom-arrow-icon {
            width: 44px;
            height: 44px;
            background-image: url('https://pcfdrglvvmlrjzhwuvze.supabase.co/storage/v1/object/public/panoramas/arrow.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .custom-arrow-label {
            margin-top: 6px;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        #tour-title-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 8px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="tour-title-bar">Loading Virtual Tour...</div>
    <div id="panorama"></div>
    <script>
        const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadTour() {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');
            if (!tourId) {
                document.getElementById('tour-title-bar').innerText = 'Tour ID not specified.';
                return;
            }

            const { data: scenes, error } = await supabaseClient
                .from('scenes')
                .select('*')
                .eq('tour_id', tourId)
                .order('order_index', { ascending: true });

            if (error || !scenes || scenes.length === 0) {
                document.getElementById('tour-title-bar').innerText = 'Tour not found.';
                return;
            }

            const scenesMap = {};
            scenes.forEach(s => { scenesMap[s.id] = s; });

            function initScene(sceneId) {
                const scene = scenesMap[sceneId];
                if (!scene) return;

                const hotspots = (scene.hotspots || []).map(hs => ({
                    pitch: hs.pitch,
                    yaw: hs.yaw,
                    type: "info",
                    text: hs.label,
                    createTooltipFunc: function(div, args) {
                        // Hide the default Pannellum wrapper box completely
                        div.style.background = 'none';
                        div.style.backgroundColor = 'transparent';
                        div.style.border = 'none';
                        div.style.boxShadow = 'none';
                        div.style.width = '0';
                        div.style.height = '0';
                        div.style.overflow = 'visible';

                        const container = document.createElement('div');
                        container.className = 'custom-arrow-container';

                        const icon = document.createElement('div');
                        icon.className = 'custom-arrow-icon';
                        container.appendChild(icon);

                        const lbl = document.createElement('div');
                        lbl.className = 'custom-arrow-label';
                        lbl.innerText = args.text;
                        container.appendChild(lbl);

                        div.appendChild(container);
                    },
                    createTooltipArgs: { text: hs.label },
                    clickHandlerFunc: function(evt, args) {
                        if (window.viewer) {
                            window.viewer.lookAt(hs.pitch, hs.yaw, 35, 300, function() {
                                initScene(args);
                            });
                        } else {
                            initScene(args);
                        }
                    },
                    clickHandlerArgs: hs.target_scene_id
                }));

                if (window.viewer) {
                    window.viewer.destroy();
                }

                window.viewer = pannellum.viewer('panorama', {
                    type: "equirectangular",
                    panorama: scene.panorama_url,
                    autoLoad: true,
                    compass: true,
                    hfov: 100,
                    hotSpots: hotspots
                });
                document.getElementById('tour-title-bar').innerText = scene.title;
            }

            initScene(scenes[0].id);
        }

        loadTour();
    </script>
</body>
</html>
