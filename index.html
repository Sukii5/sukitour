<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360 Tour Viewer</title>

  <!-- Pannellum CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
    }
    #panorama-container {
      width: 100vw;
      height: 100vh;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 13, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error-message {
      color: #ef4444;
      display: none;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner" id="spinner"></div>
    <p id="status-text">Fetching tour data...</p>
    <p id="error-message"></p>
  </div>

  <div id="panorama-container"></div>

  <script>
    // ------------------------------------------------------------------
    // CONFIGURATION: Replace with your project details
    // ------------------------------------------------------------------
    const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
    const TABLE_NAME = 'tours'; // Name of your Supabase table

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Get tour ID from URL params (e.g., viewer.html?id=123)
    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('id');

    async function loadTour() {
      const statusText = document.getElementById('status-text');
      const errorMessage = document.getElementById('error-message');
      const spinner = document.getElementById('spinner');

      if (!tourId) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = 'No tour ID provided in URL parameters (e.g., ?id=YOUR_TOUR_ID).';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        // Query Supabase table for target tour entry
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select('*')
          .eq('id', tourId)
          .single();

        if (error || !data) {
          throw new Error(error ? error.message : 'Tour record not found.');
        }

        // Hide overlay once fetched
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-overlay').style.display = 'none';
        }, 300);

        // Initialize Pannellum viewer
        pannellum.viewer('panorama-container', {
          "type": "equirectangular",
          "panorama": data.image_url, // Column holding the public image URL
          "autoLoad": true,
          "autoRotate": -2,
          "compass": false,
          "title": data.title || "Client Presentation",
          "author": data.author || "Panosphere Studio",
          "showZoomCtrl": true,
          "showFullscreenCtrl": true
        });

      } catch (err) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = `Error loading tour: ${err.message}`;
        errorMessage.style.display = 'block';
      }
    }

    window.addEventListener('DOMContentLoaded', loadTour);
  </script>
</body>
</html>
