<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">360 Tour Viewer</title>

  <!-- Pannellum CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
    }
    #panorama-container {
      width: 100vw;
      height: 100vh;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 13, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error-message {
      color: #ef4444;
      margin-top: 10px;
      max-width: 600px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner" id="spinner"></div>
    <p id="status-text">Fetching tour data...</p>
    <p id="error-message"></p>
  </div>

  <div id="panorama-container"></div>

  <script>
    const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
    const TABLE_NAME = 'tours';
    const STORAGE_BUCKET = 'tours';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('id');

    async function loadTour() {
      const statusText = document.getElementById('status-text');
      const errorMessage = document.getElementById('error-message');
      const spinner = document.getElementById('spinner');

      if (!tourId) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = 'No tour ID provided in URL parameters (e.g., ?id=YOUR_TOUR_ID).';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select('*')
          .eq('id', tourId)
          .single();

        if (error || !data) {
          throw new Error(error ? error.message : 'Tour record not found in database.');
        }

        // --- DEBUG INSPECTION ---
        // Logs the entire row columns/data to your browser console (Press F12 to check)
        console.log("Fetched Supabase Row Data:", data);

        // Dynamically update the website page title
        const projectTitle = data.title || data.name || data.project_name || "360 Tour Presentation";
        document.getElementById('page-title').innerText = projectTitle;

        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-overlay').style.display = 'none';
        }, 300);

        // Automatically loop through properties to find a valid image URL or storage path string
        let filePath = '';
        for (const key in data) {
          const val = data[key];
          if (typeof val === 'string' && (val.startsWith('http') || val.includes('.jpg') || val.includes('.png') || val.includes('.webp') || val.includes('/'))) {
            // Skip the ID field or title field if they accidentally match
            if (key !== 'id' && key !== 'title' && key !== 'name') {
              filePath = val;
              break;
            }
          }
        }

        // Fallback to explicit common keys if auto-loop missed it
        if (!filePath) {
          filePath = data.file_path || data.file || data.image_url || data.url || data.image || data.path || data.filename;
        }

        let panoramaSource = '';
        if (filePath && filePath.startsWith('http')) {
          panoramaSource = filePath;
        } else if (filePath) {
          const { data: publicURLData } = supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(filePath);
            
          panoramaSource = publicURLData.publicUrl;
        } else {
          throw new Error(`Could not find a file reference column. Check your browser console (F12) to see all columns returned for row ID: ${tourId}`);
        }

        pannellum.viewer('panorama-container', {
          "type": "equirectangular",
          "panorama": panoramaSource,
          "autoLoad": true,
          "autoRotate": -2,
          "compass": false,
          "title": projectTitle,
          "author": data.author || "Panosphere Studio",
          "showZoomCtrl": true,
          "showFullscreenCtrl": true
        });

      } catch (err) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = `Error loading tour: ${err.message}`;
        errorMessage.style.display = 'block';
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadTour);
  </script>
</body>
</html>
