<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d12">
  <title id="page-title">Panosphere · Virtual Tour</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b9d5ca' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'/><path d='M2 12h20'/></svg>">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://pcfdrglvvmlrjzhwuvze.supabase.co">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: rgba(15, 21, 29, .76);
      --panel-strong: rgba(12, 17, 24, .94);
      --line: rgba(255,255,255,.11);
      --muted: rgba(240,245,250,.62);
      --text: #f5f7fa;
      --accent: #b9d5ca;
      --accent-strong: #d8e9e1;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      background:var(--bg); color:var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button { font:inherit; color:inherit; }
    #panorama-container { position:absolute; inset:0; background:#101820; }
    #panorama-container .pnlm-container { background:#101820; }
    .viewer-vignette {
      position:absolute; inset:0; z-index:2; pointer-events:none;
      background:linear-gradient(180deg,rgba(3,7,11,.58) 0%,transparent 23%,transparent 63%,rgba(3,7,11,.48) 100%);
    }

    /* Modern & Elegant Cinematic Iris/Blur Transition Overlay */
    .scene-fade-overlay {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      background: radial-gradient(circle at center, rgba(8,13,18,0.3) 0%, rgba(4,7,10,0.88) 100%);
      backdrop-filter: blur(0px);
      opacity: 0; visibility: hidden;
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), 
                  backdrop-filter 1.1s cubic-bezier(0.16, 1, 0.3, 1), 
                  visibility 1.1s;
    }
    .scene-fade-overlay.is-active {
      opacity: 1; visibility: visible;
      backdrop-filter: blur(12px);
    }
    .scene-fade-overlay.is-revealing {
      opacity: 0; visibility: visible;
      backdrop-filter: blur(0px);
    }

    .topbar {
      position:absolute; z-index:20; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between; gap:18px;
      padding:22px clamp(18px,4vw,58px);
      pointer-events:none;
    }
    .brand, .top-actions { pointer-events:auto; }
    .brand { display:flex; align-items:center; gap:13px; min-width:0; }
    .brand-mark {
      width:39px; height:39px; flex:0 0 39px; display:grid; place-items:center;
      border:1px solid rgba(255,255,255,.25); border-radius:13px;
      background:rgba(10,16,22,.55); backdrop-filter:blur(16px);
      box-shadow:0 8px 30px rgba(0,0,0,.2);
    }
    .brand-mark svg { width:21px; height:21px; }
    .brand-copy { min-width:0; }
    .eyebrow { color:rgba(255,255,255,.62); font-size:9px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin-bottom:4px; }
    #tour-title { font-size:14px; font-weight:650; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:min(48vw,520px); }
    .top-actions { display:flex; align-items:center; gap:9px; }
    .glass-button, .icon-button {
      display:inline-flex; align-items:center; justify-content:center; gap:9px;
      height:42px; padding:0 15px; border:1px solid var(--line); border-radius:13px;
      background:rgba(10,16,22,.55); backdrop-filter:blur(18px);
      color:#f7fafc; cursor:pointer; transition:background .2s,border-color .2s,transform .2s;
      box-shadow:0 8px 25px rgba(0,0,0,.12);
    }
    .glass-button:hover, .icon-button:hover { background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.25); transform:translateY(-1px); }
    .glass-button span { font-size:12px; font-weight:600; }
    .icon-button { width:42px; padding:0; }
    .glass-button svg, .icon-button svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .scene-indicator {
      position:absolute; z-index:12; left:50%; top:50%; transform:translate(-50%,-50%);
      padding:9px 14px; border-radius:999px; background:rgba(8,13,18,.56);
      border:1px solid rgba(255,255,255,.13); backdrop-filter:blur(14px);
      color:rgba(255,255,255,.88); font-size:11px; letter-spacing:.04em;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }
    .scene-indicator.visible { opacity:1; }
    .bottom-ui {
      position:absolute; z-index:20; left:0; right:0; bottom:0;
      padding:0 clamp(16px,4vw,58px) max(22px, env(safe-area-inset-bottom));
      display:flex; flex-direction:column; gap:15px; pointer-events:none;
    }
    .bottom-row { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
    .scene-meta { pointer-events:auto; max-width:42%; min-width:0; padding-bottom:4px; text-shadow:0 2px 18px rgba(0,0,0,.5); }
    .scene-meta .eyebrow { margin-bottom:7px; }
    #current-scene-title { font-size:clamp(18px,2.2vw,25px); font-weight:600; letter-spacing:-.035em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #scene-count { color:var(--muted); font-size:11px; margin-top:5px; }
    .control-cluster { display:flex; gap:7px; pointer-events:auto; }
    .control-cluster .icon-button { width:43px; height:43px; border-radius:14px; }
    .scene-rail-wrap {
      pointer-events:none; width:100%; max-height:0; opacity:0;
      overflow:hidden; transform:translateY(12px); padding:0 10px;
      border:1px solid transparent; border-radius:19px;
      background:rgba(9,14,20,.67); backdrop-filter:blur(22px);
      box-shadow:var(--shadow);
      transition:max-height .42s cubic-bezier(.2,.8,.2,1),
        opacity .28s ease, transform .42s cubic-bezier(.2,.8,.2,1),
        padding .35s ease, border-color .35s ease;
    }
    .bottom-ui.rail-open .scene-rail-wrap {
      pointer-events:auto; max-height:130px; opacity:1;
      transform:translateY(0); padding:10px;
      border-color:rgba(255,255,255,.13);
    }
    .scene-picker-button { position:relative; }
    .scene-picker-button[aria-expanded="true"] {
      border-color:rgba(185,213,202,.55);
      background:rgba(91,132,116,.28);
      color:var(--accent-strong);
    }
    .scene-picker-button svg { transition:transform .3s ease; }
    .scene-picker-button[aria-expanded="true"] svg { transform:rotate(180deg); }
    .rail-heading { display:flex; align-items:center; justify-content:space-between; padding:1px 4px 9px; }
    .rail-heading strong { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.76); }
    .rail-heading span { color:rgba(255,255,255,.48); font-size:10px; }
    #scene-list { display:flex; gap:8px; overflow-x:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.25) transparent; padding:0 0 2px; }
    .scene-card {
      position:relative; flex:0 0 150px; height:69px; overflow:hidden;
      display:flex; align-items:flex-end; text-align:left; padding:10px 11px;
      border:1px solid rgba(255,255,255,.12); border-radius:12px;
      background:#202a32; background-size:cover; background-position:center;
      cursor:pointer; isolation:isolate; transition:border-color .2s,transform .2s,opacity .2s;
    }
    .scene-card::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.75)); }
    .scene-card:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.5); }
    .scene-card.active { border:1.5px solid var(--accent); box-shadow:inset 0 0 0 1px rgba(185,213,202,.22),0 0 0 2px rgba(185,213,202,.1); }
    .scene-card span { font-size:11px; font-weight:600; line-height:1.2; text-shadow:0 1px 8px #000; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .scene-card .scene-number { position:absolute; top:8px; left:9px; font-size:9px; color:rgba(255,255,255,.8); }
    .hint {
      position:absolute; z-index:8; top:91px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:8px; padding:9px 13px;
      color:rgba(255,255,255,.8); font-size:10px; letter-spacing:.02em;
      background:rgba(8,13,18,.4); border:1px solid rgba(255,255,255,.1);
      border-radius:999px; backdrop-filter:blur(12px); pointer-events:none;
      transition:opacity .5s;
    }
    .hint svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7; }
    .hint.hidden { opacity:0; }
    
    /* Pannellum controls */
    .pnlm-controls { top:auto !important; bottom:86px !important; right:clamp(16px,4vw,58px) !important; left:auto !important; border-radius:12px !important; overflow:hidden; box-shadow:0 8px 25px rgba(0,0,0,.22); }
    body.rail-open .pnlm-controls { bottom:154px !important; }
    .pnlm-control { background-color:rgba(9,14,20,.72) !important; backdrop-filter:blur(12px); }
    .pnlm-control:hover { background-color:rgba(35,47,57,.9) !important; }
    .pnlm-hotspot-base { z-index:5; }
    
    div.pnlm-hotspot-container div.pnlm-hotspot.custom-hotspot {
      position:relative !important;
      display:block !important;
      width:48px !important; height:48px !important;
      min-width:48px !important; min-height:48px !important;
      padding:0 !important; margin:0 !important;
      overflow:visible !important;
      background:none !important; border:0 !important; box-shadow:none !important;
      cursor:pointer !important;
      transform:translate(-50%,-50%) !important;
      z-index:100 !important;
    }

    /* Unified Floating & Breathing Pulse Animation */
    @keyframes modernFloatPulse {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.35));
      }
      50% {
        transform: translateY(-6px) scale(1.02);
        filter: drop-shadow(0 10px 22px rgba(185, 213, 202, 0.25));
      }
    }

    .hotspot-content-anchor {
      position: absolute !important;
      left: 50% !important; 
      top: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      transform-origin: center top !important;
      pointer-events: auto !important;
      animation: modernFloatPulse 3s ease-in-out infinite !important;
      transition: transform 0.3s ease, filter 0.3s ease !important;
    }

    div.pnlm-hotspot.custom-hotspot:hover .hotspot-content-anchor {
      animation-play-state: paused !important;
      transform: translateY(-8px) scale(1.08) !important;
      filter: drop-shadow(0 12px 28px rgba(185, 213, 202, 0.4)) !important;
    }

    .hotspot-preview-circle {
      position: relative !important;
      left: 0 !important;
      top: 0 !important;
      transform: none !important;
      width: 32px !important; 
      height: 32px !important; 
      border-radius: 50% !important;
      border: 2px solid rgba(255,255,255,.95) !important;
      box-shadow: 0 4px 14px rgba(0,0,0,.4), 0 0 0 4px rgba(255,255,255,.14) !important;
      background-size: cover !important; 
      background-position: center !important;
      background-repeat: no-repeat !important; 
      background-color: #26313a !important;
      transition: border-color 0.3s, box-shadow 0.3s !important;
    }

    div.pnlm-hotspot.custom-hotspot:hover .hotspot-preview-circle {
      border-color: var(--accent-strong) !important;
      box-shadow: 0 6px 20px rgba(0,0,0,.6), 0 0 0 6px rgba(185,213,202,.3) !important;
    }

    .hotspot-preview-label {
      position: relative !important;
      left: 0 !important;
      top: 6px !important;
      transform: none !important;
      display: block !important;
      width: max-content !important; 
      max-width: 160px !important;
      margin: 0 !important; 
      text-align: center !important;
      background: rgba(12, 17, 24, 0.82) !important;
      backdrop-filter: blur(8px) !important; 
      color: #fff !important; 
      font-size: 10px !important;
      font-weight: 500 !important; 
      letter-spacing: .02em !important; 
      padding: 4px 10px !important;
      border-radius: 8px !important; 
      border: 1px solid rgba(255,255,255,.2) !important;
      white-space: nowrap !important; 
      pointer-events: none !important;
      box-shadow: 0 4px 12px rgba(0,0,0,.3) !important;
      transition: border-color 0.3s, background 0.3s !important;
    }

    div.pnlm-hotspot.custom-hotspot:hover .hotspot-preview-label {
      border-color: rgba(185, 213, 202, 0.6) !important;
      background: rgba(18, 25, 34, 0.92) !important;
      color: var(--accent-strong) !important;
    }

    .gyro-button { display:none; }
    .gyro-button.is-active { border-color:rgba(185,213,202,.75); background:rgba(91,132,116,.42); color:var(--accent-strong); }
    .pnlm-load-box, .pnlm-lbox {
      display:none !important;
      visibility:hidden !important;
      opacity:0 !important;
      pointer-events:none !important;
    }
    #panorama-container {
      transform:scale(1);
      transform-origin:50% 50%;
      transition:transform 1.4s cubic-bezier(0.25, 1, 0.5, 1);
      will-change:transform;
    }
    #panorama-container.is-zooming {
      transform:scale(1.15);
    }

    #loading-overlay {
      position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
      justify-content:center; align-items:center; gap:13px; padding:24px; text-align:center;
      background:radial-gradient(ellipse at 50% 45%,#1a2830 0%,#0c1219 58%,#080c11 100%);
      transition:opacity .65s ease,visibility .65s ease;
    }
    #loading-overlay.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .loader-mark {
      width:54px; height:54px; display:grid; place-items:center; border-radius:18px;
      border:1px solid rgba(255,255,255,.17); background:rgba(255,255,255,.05); margin-bottom:7px;
    }
    .loader-mark svg { width:27px; height:27px; stroke:var(--accent); fill:none; stroke-width:1.3; }
    .spinner { width:24px; height:24px; border:2px solid rgba(255,255,255,.13); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #status-text { color:rgba(255,255,255,.72); font-size:12px; letter-spacing:.04em; }
    #error-message { display:none; max-width:540px; color:#ffc0b8; font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
    .error-action { display:none; margin-top:7px; padding:10px 15px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.08); cursor:pointer; font-size:12px; }
    .brand-footer { position:absolute; z-index:18; right:clamp(18px,4vw,58px); bottom:clamp(145px,17vw,190px); color:rgba(255,255,255,.45); font-size:9px; letter-spacing:.14em; text-transform:uppercase; pointer-events:none; }
    @media (max-width:640px) {
      .topbar { padding:15px 15px; }
      .brand-mark { width:35px; height:35px; flex-basis:35px; border-radius:11px; }
      .eyebrow { font-size:8px; }
      #tour-title { max-width:45vw; font-size:12px; }
      .glass-button { width:39px; height:39px; padding:0; border-radius:12px; }
      .glass-button span { display:none; }
      .icon-button { width:39px; height:39px; }
      .hint { top:72px; max-width:calc(100% - 30px); white-space:nowrap; font-size:9px; }
      .bottom-ui { padding:0 12px max(12px,env(safe-area-inset-bottom)); gap:11px; }
      .bottom-row { align-items:center; }
      .scene-meta { max-width:54%; }
      #current-scene-title { font-size:18px; }
      #scene-count { font-size:10px; }
      .control-cluster { gap:5px; }
      .control-cluster .icon-button { width:37px; height:37px; border-radius:12px; }
      .gyro-button { display:inline-flex; }
      div.pnlm-hotspot-container div.pnlm-hotspot.custom-hotspot {
        width:32px !important; height:32px !important;
        min-width:32px !important; min-height:32px !important;
      }
      .hotspot-preview-circle { width:30px !important; height:30px !important; box-shadow:0 3px 12px rgba(0,0,0,.48),0 0 0 3px rgba(255,255,255,.11) !important; }
      .hotspot-preview-label { top:4px !important; max-width:112px !important; padding:3px 7px !important; border-radius:6px !important; font-size:9px !important; line-height:1.2 !important; }
      .scene-rail-wrap { padding:8px; border-radius:15px; }
      .rail-heading { padding:1px 3px 7px; }
      .scene-card { flex-basis:116px; height:58px; padding:8px; border-radius:10px; }
      .scene-card span { font-size:10px; }
      .pnlm-controls { bottom:76px !important; right:12px !important; transform:scale(.88); transform-origin:bottom right; }
      body.rail-open .pnlm-controls { bottom:132px !important; }
      .brand-footer { display:none; }
    }
    @media (pointer:coarse) {
      .gyro-button { display:inline-flex; }
    }
    @media (max-height:520px) and (min-width:641px) {
      .topbar { padding-top:12px; }
      .bottom-ui { gap:8px; padding-bottom:10px; }
      .scene-card { height:53px; }
      .scene-rail-wrap { padding:7px; }
      .pnlm-controls { bottom:115px !important; }
      .brand-footer { display:none; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="panorama-container"></div>
  <div class="viewer-vignette"></div>
  <div class="scene-fade-overlay" id="scene-fade-overlay" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 12c2.1-4.2 5.1-6.3 9-6.3s6.9 2.1 9 6.3c-2.1 4.2-5.1 6.3-9 6.3S5.1 16.2 3 12Z"/><path d="M12 5.7c2 1.7 3 3.8 3 6.3s-1 4.6-3 6.3c-2-1.7-3-3.8-3-6.3s1-4.6 3-6.3Z"/><circle cx="12" cy="12" r="2"/></svg>
      </div>
      <div class="brand-copy">
        <div class="eyebrow">Panosphere · Virtual experience</div>
        <div id="tour-title">Panosphere Studio</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="glass-button" id="share-button" type="button" aria-label="Copy tour link">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        <span id="share-label">Share tour</span>
      </button>
      <button class="icon-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <div class="hint" id="interaction-hint">
    <svg viewBox="0 0 24 24"><path d="M8 12V6a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.7-2.9L3.5 15a2 2 0 0 1 3-2.6L8 14"/></svg>
    Drag to explore · Select a portal to move between spaces
  </div>

  <div class="scene-indicator" id="scene-indicator">Loading space…</div>

  <div class="bottom-ui">
    <div class="bottom-row">
      <div class="scene-meta">
        <div class="eyebrow">You are exploring</div>
        <div id="current-scene-title">Your virtual space</div>
        <div id="scene-count"></div>
      </div>
      <div class="control-cluster">
        <button class="icon-button scene-picker-button" id="scene-picker-toggle" type="button"
          aria-label="Open scene selection" aria-expanded="false" aria-controls="scene-rail" title="Explore spaces">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="12" width="18" height="8" rx="1.5"/><path d="m9 15 3 3 3-3"/></svg>
        </button>
        <button class="icon-button" id="reset-view" type="button" aria-label="Reset view" title="Reset view">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="icon-button" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="M16.2 16.2 21 21M7.5 10.8h6.6"/></svg>
        </button>
        <button class="icon-button" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="M16.2 16.2 21 21M7.5 10.8h6.6M10.8 7.5v6.6"/></svg>
        </button>
        <button class="icon-button gyro-button" id="gyro-toggle" type="button" aria-label="Enable motion controls" title="Enable motion controls">
          <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="6.5"/><path d="m9.5 12 1.7 1.7 3.5-3.5"/></svg>
        </button>
      </div>
    </div>
    <section class="scene-rail-wrap" id="scene-rail" aria-label="Tour scenes" aria-hidden="true">
      <div class="rail-heading"><strong>Explore spaces</strong><span id="rail-count">Scenes in this tour</span></div>
      <div id="scene-list"></div>
    </section>
  </div>

  <div id="loading-overlay">
    <div class="loader-mark"><svg viewBox="0 0 24 24"><path d="M2.8 12c2-4 5.1-6 9.2-6s7.2 2 9.2 6c-2 4-5.1 6-9.2 6s-7.2-2-9.2-6Z"/><path d="M12 6c2 1.7 3 3.7 3 6s-1 4.3-3 6c-2-1.7-3-3.7-3-6s1-4.3 3-6Z"/></svg></div>
    <div class="spinner" id="spinner"></div>
    <p id="status-text">Preparing your virtual experience…</p>
    <p id="error-message"></p>
    <button class="error-action" id="retry-button" type="button">Try again</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('id');

    let viewerInstance = null;
    let scenes = [];
    let activeSceneId = null;
    let isLoadingScene = false;
    let preloadedImages = new Map();
    let gyroActive = false;

    const $ = (id) => document.getElementById(id);

    function preloadPanoramas(sceneList) {
      const urls = [...new Set(sceneList.map(scene => scene.panorama_url).filter(Boolean))];
      urls.forEach((url) => {
        if (preloadedImages.has(url)) return;
        const image = new Image();
        image.decoding = 'async';
        image.loading = 'eager';
        if ('fetchPriority' in image) image.fetchPriority = 'high';
        image.src = url;
        const ready = typeof image.decode === 'function'
          ? image.decode().catch(() => {})
          : new Promise(resolve => { image.onload = resolve; image.onerror = resolve; });
        preloadedImages.set(url, ready);
      });
    }

    function isMobileDevice() {
      return window.matchMedia('(max-width: 640px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    async function enableGyro(fromUserGesture = false) {
      if (!viewerInstance || !isMobileDevice()) return;
      const orientation = window.DeviceOrientationEvent;
      if (!orientation) {
        $('gyro-toggle').title = 'Motion controls are not supported on this device';
        return;
      }
      try {
        if (typeof orientation.requestPermission === 'function') {
          if (!fromUserGesture) {
            $('gyro-toggle').classList.remove('is-active');
            $('gyro-toggle').title = 'Tap to allow motion controls';
            return;
          }
          const permission = await orientation.requestPermission();
          if (permission !== 'granted') throw new Error('Motion permission was not granted');
        }
        if (typeof viewerInstance.startOrientation === 'function') {
          viewerInstance.startOrientation();
          gyroActive = true;
          $('gyro-toggle').classList.add('is-active');
          $('gyro-toggle').title = 'Motion controls enabled';
          $('gyro-toggle').setAttribute('aria-label', 'Disable motion controls');
        }
      } catch (error) {
        gyroActive = false;
        $('gyro-toggle').classList.remove('is-active');
        $('gyro-toggle').title = 'Tap to retry motion permission';
        console.info('Device orientation is not active:', error);
      }
    }

    function toggleGyro() {
      if (!viewerInstance) return;
      if (gyroActive && typeof viewerInstance.stopOrientation === 'function') {
        viewerInstance.stopOrientation();
        gyroActive = false;
        $('gyro-toggle').classList.remove('is-active');
        $('gyro-toggle').title = 'Enable motion controls';
        $('gyro-toggle').setAttribute('aria-label', 'Enable motion controls');
      } else {
        enableGyro(true);
      }
    }

    function showError(message) {
      $('spinner').style.display = 'none';
      $('status-text').style.display = 'none';
      $('error-message').style.display = 'block';
      $('error-message').textContent = message;
      $('retry-button').style.display = 'inline-flex';
      $('loading-overlay').classList.remove('is-hidden');
    }

    function hideLoader() {
      $('loading-overlay').classList.add('is-hidden');
    }

    function updateSceneUI(sceneId) {
      const scene = scenes.find(item => String(item.id) === String(sceneId));
      if (!scene) return;
      activeSceneId = sceneId;
      $('current-scene-title').textContent = scene.title || 'Untitled space';
      const index = scenes.findIndex(item => String(item.id) === String(sceneId));
      $('scene-count').textContent = `Space ${index + 1} of ${scenes.length}`;
      document.querySelectorAll('.scene-card').forEach(card => {
        const selected = card.dataset.sceneId === String(sceneId);
        card.classList.toggle('active', selected);
        if (selected) card.setAttribute('aria-current', 'true');
        else card.removeAttribute('aria-current');
      });
    }

    function createSceneRail() {
      const list = $('scene-list');
      list.innerHTML = '';
      scenes.forEach((scene, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'scene-card';
        button.dataset.sceneId = String(scene.id);
        button.style.backgroundImage = `url("${String(scene.panorama_url || '').replace(/"/g, '%22')}")`;
        button.setAttribute('aria-label', `Explore ${scene.title || `Space ${index + 1}`}`);
        const number = document.createElement('small');
        number.className = 'scene-number';
        number.textContent = String(index + 1).padStart(2, '0');
        const title = document.createElement('span');
        title.textContent = scene.title || `Space ${index + 1}`;
        button.append(number, title);
        button.addEventListener('click', () => {
          if (viewerInstance && String(scene.id) !== String(activeSceneId)) {
            transitionToScene(scene.id);
          }
        });
        list.appendChild(button);
      });
      $('rail-count').textContent = `${scenes.length} ${scenes.length === 1 ? 'space' : 'spaces'}`;
    }

    let sceneTransitionToken = 0;
    async function transitionToScene(sceneId) {
      if (!viewerInstance || !sceneId || String(sceneId) === String(activeSceneId)) return;

      const targetScene = scenes.find(scene => String(scene.id) === String(sceneId));
      const imageReady = targetScene && preloadedImages.get(targetScene.panorama_url);
      const token = ++sceneTransitionToken;
      const fade = $('scene-fade-overlay');

      try {
        // Smooth camera forward zoom glide into the portal
        const currentHfov = viewerInstance.getHfov();
        viewerInstance.setHfov(Math.max(75, currentHfov - 14), 1100);
      } catch (error) {
        console.debug('Camera glide was skipped:', error);
      }

      try {
        if (imageReady) await imageReady;
        if (token !== sceneTransitionToken || !viewerInstance) return;

        // Elegant blur + radial vignette fade-out
        fade.classList.remove('is-revealing');
        fade.classList.add('is-active');
        await new Promise(resolve => window.setTimeout(resolve, 650));
        if (token !== sceneTransitionToken || !viewerInstance) return;

        viewerInstance.loadScene(sceneId);
      } catch (error) {
        console.warn('Preloaded panorama was unavailable; loading normally:', error);
        if (token === sceneTransitionToken && viewerInstance) viewerInstance.loadScene(sceneId);
      }
    }


    function createPreviewHotspot(hotSpotDiv, args) {
      hotSpotDiv.classList.add('custom-hotspot');
      const circleEl = document.createElement('div');
      circleEl.className = 'hotspot-preview-circle';
      if (args.imageUrl) circleEl.style.backgroundImage = `url("${String(args.imageUrl).replace(/"/g, '%22')}")`;
      const labelEl = document.createElement('div');
      labelEl.className = 'hotspot-preview-label';
      labelEl.textContent = args.title || 'Explore space';
      const anchorEl = document.createElement('div');
      anchorEl.className = 'hotspot-content-anchor';
      anchorEl.append(circleEl, labelEl);
      hotSpotDiv.append(anchorEl);
      hotSpotDiv.setAttribute('role', 'button');
      hotSpotDiv.setAttribute('aria-label', `Navigate to ${args.title || 'another space'}`);
      hotSpotDiv.addEventListener('click', (event) => {
        event.stopPropagation();
        if (viewerInstance && args.targetSceneId) transitionToScene(args.targetSceneId);
      });
    }

    async function loadTour() {
      $('retry-button').style.display = 'none';
      $('error-message').style.display = 'none';
      $('spinner').style.display = 'block';
      $('status-text').style.display = 'block';
      $('status-text').textContent = 'Preparing your virtual experience…';

      if (!tourId) {
        showError('This tour link is missing its tour ID. Please check that you have the complete link shared by the tour creator.');
        return;
      }

      try {
        const { data: tourData, error: tourError } = await supabaseClient
          .from('tours').select('*').eq('id', tourId).single();
        if (tourError || !tourData) throw new Error(tourError ? tourError.message : 'Tour project not found.');

        const projectTitle = tourData.title || 'Panosphere Studio';
        document.title = `${projectTitle}`;
        $('tour-title').textContent = projectTitle;

        const { data: scenesData, error: scenesError } = await supabaseClient
          .from('scenes').select('*').eq('tour_id', tourId).order('order_index', { ascending: true });
        if (scenesError || !scenesData || scenesData.length === 0) {
          throw new Error(scenesError ? scenesError.message : 'No scenes were found in this tour.');
        }

        scenes = scenesData;
        preloadPanoramas(scenesData);
        const sceneMap = {};
        scenesData.forEach(scene => {
          sceneMap[scene.id] = { title: scene.title, imageUrl: scene.panorama_url };
        });

        const pannellumScenes = {};
        const firstSceneId = scenesData[0].id;
        scenesData.forEach(scene => {
          const formattedHotspots = (scene.hotspots || []).map(hs => {
            const targetSceneId = hs.targetSceneId || hs.target_scene_id || hs.sceneId ||
              hs.scene_id || hs.targetId || hs.id;
            const targetScene = sceneMap[targetSceneId] || {};
            return {
              pitch: Number(hs.pitch) || 0,
              yaw: Number(hs.yaw) || 0,
              type: 'custom',
              createTooltipFunc: createPreviewHotspot,
              createTooltipArgs: {
                title: hs.text || hs.title || targetScene.title || 'Explore space',
                imageUrl: targetScene.imageUrl || scenesData[0].panorama_url,
                targetSceneId: targetSceneId || firstSceneId
              }
            };
          });

          pannellumScenes[scene.id] = {
            title: scene.title || 'Room',
            type: 'equirectangular',
            panorama: scene.panorama_url,
            pitch: Number(scene.initial_pitch) || 0,
            yaw: Number(scene.initial_yaw) || 0,
            hfov: Math.max(110, Math.min(120, Number(scene.initial_hfov) || 110)),
            autoLoad: true,
            hotSpots: formattedHotspots
          };
        });

        createSceneRail();

        if (viewerInstance) {
          viewerInstance.destroy();
          viewerInstance = null;
        }

        viewerInstance = pannellum.viewer('panorama-container', {
          default: {
            firstScene: firstSceneId,
            autoRotate: -1,
            autoRotateInactivityDelay: 5000,
            autoRotateStopDelay: 15000,
            showZoomCtrl: false,
            showFullscreenCtrl: false,
            showControls: false,
            orientationOnByDefault: true,
            maxHfov: 120,
            sceneFadeDuration: 2000,
            compass: false,
            keyboardZoom: true,
            mouseZoom: true,
            friction: 0.15,
          },
          scenes: pannellumScenes
        });

        viewerInstance.on('load', () => {
          hideLoader();
          isLoadingScene = false;
          updateSceneUI(viewerInstance.getScene());
          const fade = $('scene-fade-overlay');
          if (fade.classList.contains('is-active')) {
            fade.classList.remove('is-active');
            fade.classList.add('is-revealing');
            window.setTimeout(() => {
              fade.classList.remove('is-revealing');
            }, 1100);
          }
          if (viewerInstance.getHfov() < 110) viewerInstance.setHfov(110, 0);
          if (isMobileDevice()) enableGyro(false);
        });
        viewerInstance.on('scenechange', (sceneId) => {
          isLoadingScene = true;
          updateSceneUI(sceneId);
        });
        viewerInstance.on('scenechangefadedone', () => {
          isLoadingScene = false;
          const fade = $('scene-fade-overlay');
          fade.classList.remove('is-active');
          fade.classList.add('is-revealing');
          window.setTimeout(() => fade.classList.remove('is-revealing'), 1100);
        });
        viewerInstance.on('error', (error) => {
          console.error('Panorama viewer error:', error);
        });
        updateSceneUI(firstSceneId);
        $('interaction-hint').classList.remove('hidden');
        window.setTimeout(() => $('interaction-hint').classList.add('hidden'), 6500);
      } catch (error) {
        console.error('Unable to load tour:', error);
        showError(`We couldn't load this virtual tour. ${error.message || 'Please try again in a moment.'}`);
      }
    }

    function adjustZoom(amount) {
      if (!viewerInstance) return;
      const current = viewerInstance.getHfov();
      viewerInstance.setHfov(Math.max(30, Math.min(120, current + amount)), 250);
    }

    const scenePickerToggle = $('scene-picker-toggle');
    scenePickerToggle.addEventListener('click', () => {
      const isOpen = $('scene-rail').closest('.bottom-ui').classList.toggle('rail-open');
      document.body.classList.toggle('rail-open', isOpen);
      scenePickerToggle.setAttribute('aria-expanded', String(isOpen));
      scenePickerToggle.setAttribute('aria-label', isOpen ? 'Close scene selection' : 'Open scene selection');
      scenePickerToggle.title = isOpen ? 'Close spaces' : 'Explore spaces';
      $('scene-rail').setAttribute('aria-hidden', String(!isOpen));
    });

    $('zoom-in').addEventListener('click', () => adjustZoom(-8));
    $('gyro-toggle').addEventListener('click', toggleGyro);
    $('zoom-out').addEventListener('click', () => adjustZoom(8));
    $('reset-view').addEventListener('click', () => {
      if (!viewerInstance) return;
      const scene = scenes.find(item => String(item.id) === String(activeSceneId));
      viewerInstance.setPitch(Number(scene?.initial_pitch) || 0, 450);
      viewerInstance.setYaw(Number(scene?.initial_yaw) || 0, 450);
      viewerInstance.setHfov(Math.max(110, Math.min(120, Number(scene?.initial_hfov) || 110)), 450);
    });
    $('fullscreen-button').addEventListener('click', () => {
      if (!viewerInstance) return;
      viewerInstance.toggleFullscreen();
    });
    $('share-button').addEventListener('click', async () => {
      const label = $('share-label');
      try {
        if (navigator.share) {
          await navigator.share({ title: document.title, url: window.location.href });
        } else if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(window.location.href);
          label.textContent = 'Link copied';
          window.setTimeout(() => label.textContent = 'Share tour', 1800);
        } else {
          label.textContent = 'Copy unavailable';
          window.setTimeout(() => label.textContent = 'Share tour', 1800);
        }
      } catch (error) {
        if (error.name !== 'AbortError') console.warn('Share action was not completed:', error);
      }
    });
    $('retry-button').addEventListener('click', loadTour);
    window.addEventListener('DOMContentLoaded', loadTour);
  </script>
</body>
</html>
