<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano360 Virtual Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-deep: #07090e;
            --glass-bg: rgba(11, 15, 23, 0.72);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body, html { 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            background-color: var(--bg-deep); 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        
        #panorama { width: 100%; height: 100%; }

        /* Neutralize Pannellum's default info hotspot wrapper */
        .pnm-info-hotspot {
            background: none !important;
            background-image: none !important;
            border: none !important;
            box-shadow: none !important;
            width: auto !important;
            height: auto !important;
        }
        .pnm-info-hotspot::after {
            display: none !important;
        }

        /* Forcefully remove lingering focus rings, outlines, or click highlights */
        .pnm-info-hotspot, 
        .pnm-info-hotspot div, 
        .pnm-info-hotspot span,
        .pnm-info-hotspot * {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            box-shadow: none !important;
        }

        .pnm-info-hotspot:focus, 
        .pnm-info-hotspot:active {
            background-color: transparent !important;
            outline: none !important;
            box-shadow: none !important;
        }

        @keyframes floatBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes pulseRing {
            0% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Completely annihilate Pannellum's native scene title elements */
        .pnm-title, 
        .pnm-scene-title,
        .pnm-scene-information, 
        .pnm-load-box,
        div.pnm-title,
        div.pnm-scene-title,
        span.pnm-scene-title,
        div[class*="pnm-title"],
        div[class*="scene-title"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-deep);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 99;
        }

        .custom-arrow-container {
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            user-select: none !important;
            outline: none !important;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            animation: floatBounce 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-arrow-container:hover {
            transform: scale(1.12) translateY(-4px);
        }

        .custom-arrow-container, .interactive-text-card {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent !important;
        }

        .custom-arrow-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid rgba(255, 255, 255, 0.9);
            animation: pulseRing 2.4s infinite cubic-bezier(0.4, 0, 0.6, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        /* Modern Aesthetic Hotspot Label */
        .custom-arrow-label {
            margin-top: 6px;
            background: var(--glass-bg) !important;
            color: var(--text-primary);
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.3px;
            padding: 4px 10px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            pointer-events: none;
        }

        /* Premium Floating Glassmorphic Top Title Bar */
        #tour-title-bar {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            color: var(--text-primary);
            padding: 6px 18px;
            border-radius: 14px;
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 0.4px;
            z-index: 10;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        #tour-title-bar::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
        }
    </style>
</head>
<body>
    <div id="tour-title-bar">Loading Virtual Tour...</div>
    <div id="transition-overlay"></div>
    <div id="panorama"></div>

    <script>
        const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
        async function loadTour() {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');
            
            console.log('[Debug] Script running. Extracted tourId:', tourId);
    
            if (!tourId) {
                document.getElementById('tour-title-bar').innerText = 'Tour ID not specified.';
                return;
            }
    
            const { data: tourData, error: tourError } = await supabaseClient
                .from('tours')
                .select('*')
                .eq('id', tourId)
                .single();
    
            console.log('[Debug] Supabase Data:', tourData);
            console.log('[Debug] Supabase Error:', tourError);
    
            if (tourError || !tourData) {
                document.getElementById('tour-title-bar').innerText = 'Tour not found in database.';
                return;
            }
    
            document.getElementById('tour-title-bar').innerText = tourData.title || 'Loaded Tour';
        }
    
        // CRITICAL: Ensure the function is actually called when the page loads!
        loadTour();
    </script>
</body>
</html>
