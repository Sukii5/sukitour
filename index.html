<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pano360 Virtual Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { width: 100%; height: 100%; margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #panorama { width: 100%; height: 100%; }
        .pnm-hotspot, .pnm-info-hotspot {
            cursor: pointer;
            background-size: contain !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            background-color: transparent !important;
            border: none !important;
            width: 44px !important;
            height: 44px !important;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.8)) !important;
        }
        .pnm-hotspot::after, .pnm-info-hotspot::after { content: "" !important; display: none !important; }
        .pnm-info-hotspot, .custom-arrow-icon {
            background-image: url('https://pcfdrglvvmlrjzhwuvze.supabase.co/storage/v1/object/public/panoramas/arrow.png') !important;
        }
        .custom-arrow-label {
            position: absolute;
            top: 46px;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            pointer-events: none;
        }
        #tour-title-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="tour-title-bar">Loading Virtual Tour...</div>
    <div id="panorama"></div>
    <script>
        const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadTour() {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');
            if (!tourId) {
                document.getElementById('tour-title-bar').innerText = 'Tour ID not specified.';
                return;
            }

            const { data: scenes, error } = await supabaseClient
                .from('scenes')
                .select('*')
                .eq('tour_id', tourId)
                .order('order_index', { ascending: true });

            if (error || !scenes || scenes.length === 0) {
                document.getElementById('tour-title-bar').innerText = 'Tour not found.';
                return;
            }

            const scenesMap = {};
            scenes.forEach(s => { scenesMap[s.id] = s; });

            function initScene(sceneId) {
                const scene = scenesMap[sceneId];
                if (!scene) return;

                const hotspots = (scene.hotspots || []).map(hs => ({
                    pitch: hs.pitch,
                    yaw: hs.yaw,
                    type: "info",
                    text: hs.label,
                    createTooltipFunc: function(div, args) {
                        div.classList.add('custom-arrow-icon');
                        const lbl = document.createElement('div');
                        lbl.className = 'custom-arrow-label';
                        lbl.innerText = args.text;
                        div.appendChild(lbl);
                    },
                    createTooltipArgs: { text: hs.label },
                    clickHandlerFunc: function(evt, args) {
                        if (window.viewer) {
                            window.viewer.lookAt(hs.pitch, hs.yaw, 35, 300, function() {
                                initScene(args);
                            });
                        } else {
                            initScene(args);
                        }
                    },
                    clickHandlerArgs: hs.target_scene_id
                }));

                if (window.viewer) {
                    window.viewer.destroy();
                }

                window.viewer = pannellum.viewer('panorama', {
                    type: "equirectangular",
                    panorama: scene.panorama_url,
                    autoLoad: true,
                    compass: true,
                    hfov: 100,
                    hotSpots: hotspots
                });
                document.getElementById('tour-title-bar').innerText = scene.title;
            }

            initScene(scenes[0].id);
        }

        loadTour();
    </script>
</body>
</html>
