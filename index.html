<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">360 Tour Viewer</title>

  <!-- Pannellum CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
    }
    #panorama-container {
      width: 100vw;
      height: 100vh;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 13, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error-message {
      color: #ef4444;
      margin-top: 10px;
      max-width: 600px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner" id="spinner"></div>
    <p id="status-text">Loading tour project...</p>
    <p id="error-message"></p>
  </div>

  <div id="panorama-container"></div>

  <script>
    const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('id');

    async function loadTour() {
      const statusText = document.getElementById('status-text');
      const errorMessage = document.getElementById('error-message');
      const spinner = document.getElementById('spinner');

      if (!tourId) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = 'No tour ID provided in URL parameters (e.g., https://suki-tour.vercel.app/?id=YOUR_TOUR_ID).';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        // 1. Fetch Tour Project Title
        const { data: tourData, error: tourError } = await supabaseClient
          .from('tours')
          .select('*')
          .eq('id', tourId)
          .single();

        if (tourError || !tourData) {
          throw new Error(tourError ? tourError.message : 'Tour project not found.');
        }

        const projectTitle = tourData.title || "Panosphere Studio";
        document.title = projectTitle;
        document.getElementById('page-title').innerText = projectTitle;

        // 2. Fetch all scenes belonging to this tour_id ordered by order_index
        const { data: scenesData, error: scenesError } = await supabaseClient
          .from('scenes')
          .select('*')
          .eq('tour_id', tourId)
          .order('order_index', { ascending: true });

        if (scenesError || !scenesData || scenesData.length === 0) {
          throw new Error('No scenes found for this tour ID.');
        }

        // 3. Construct Pannellum multi-scene structure
        const pannellumScenes = {};
        const firstSceneId = scenesData[0].id;

        // Quick title lookup map for hotspots
        const sceneTitleMap = {};
        scenesData.forEach(s => {
          sceneTitleMap[s.id] = s.title;
        });

        scenesData.forEach((scene) => {
          const rawHotspots = scene.hotspots || [];
          const formattedHotspots = [];

          // Map JSONB hotspots to Pannellum hotspot parameters
          rawHotspots.forEach(hs => {
            const targetSceneId = hs.targetSceneId || hs.target_scene_id || hs.sceneId;
            formattedHotspots.push({
              pitch: hs.pitch || 0,
              yaw: hs.yaw || 0,
              type: "scene",
              text: hs.text || sceneTitleMap[targetSceneId] || "Navigate",
              sceneId: targetSceneId
            });
          });

          pannellumScenes[scene.id] = {
            title: scene.title || "Room",
            type: "equirectangular",
            panorama: scene.panorama_url,
            pitch: scene.initial_pitch || 0,
            yaw: scene.initial_yaw || 0,
            hfov: scene.initial_hfov || 100,
            autoLoad: true,
            hotSpots: formattedHotspots
          };
        });

        // Hide loading screen
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-overlay').style.display = 'none';
        }, 300);

        // 4. Initialize Viewer
        pannellum.viewer('panorama-container', {
          "default": {
            "firstScene": firstSceneId,
            "autoRotate": -2,
            "showZoomCtrl": true,
            "showFullscreenCtrl": true,
            "sceneFadeDuration": 1000,
            "author": "Panosphere Studio"
          },
          "scenes": pannellumScenes
        });

      } catch (err) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = `Error loading tour: ${err.message}`;
        errorMessage.style.display = 'block';
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadTour);
  </script>
</body>
</html>
