<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">360 Tour Viewer</title>

  <!-- Pannellum CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
    }
    #panorama-container {
      width: 100vw;
      height: 100vh;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 13, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.3s ease;
      padding: 20px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { rotate: 360deg; }
    }
    #error-message {
      color: #ef4444;
      margin-top: 10px;
      max-width: 600px;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner" id="spinner"></div>
    <p id="status-text">Fetching multi-scene tour data...</p>
    <p id="error-message"></p>
  </div>

  <div id="panorama-container"></div>

  <script>
    const SUPABASE_URL = 'https://pcfdrglvvmlrjzhwuvze.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_btfQ4JKEiDvRm89qO8TZFg_n1rBqVGz';
    const STORAGE_BUCKET = 'panoramas';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('id');

    async function loadTour() {
      const statusText = document.getElementById('status-text');
      const errorMessage = document.getElementById('error-message');
      const spinner = document.getElementById('spinner');

      if (!tourId) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = 'No tour ID provided in URL parameters (e.g., ?id=YOUR_TOUR_ID).';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        // 1. Fetch Tour details from 'tours' table
        const { data: tourData, error: tourError } = await supabaseClient
          .from('tours')
          .select('*')
          .eq('id', tourId)
          .single();

        if (tourError || !tourData) {
          throw new Error(tourError ? tourError.message : 'Tour record not found in tours table.');
        }

        const projectTitle = tourData.title || tourData.name || "360 Tour Presentation";
        document.getElementById('page-title').innerText = projectTitle;

        // 2. Fetch all scenes belonging to this tour
        const { data: scenesData, error: scenesError } = await supabaseClient
          .from('scenes')
          .select('*')
          .eq('tour_id', tourId);

        if (scenesError || !scenesData || scenesData.length === 0) {
          throw new Error('No scenes found for this tour in the scenes table.');
        }

        console.log("Fetched All Tour Scenes:", scenesData);

        // 3. Fetch walkthroughs/hotlinks if available in your database schema
        let walkthroughsData = [];
        const { data: wtData } = await supabaseClient
          .from('walkthroughs')
          .select('*')
          .eq('tour_id', tourId);
        
        if (wtData) {
          walkthroughsData = wtData;
        }

        // Hide loading screen
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading-overlay').style.display = 'none';
        }, 300);

        // 4. Build Pannellum multi-scene configuration object
        let pannellumScenes = {};
        let firstSceneId = null;

        scenesData.forEach((scene, index) => {
          const sceneKey = scene.id || `scene_${index}`;
          if (index === 0) firstSceneId = sceneKey;

          // Resolve image path/URL from scene
          let filePath = scene.image_path || scene.file_path || scene.panorama || scene.file_name || scene.filename || scene.image || scene.url || scene.file || scene.path;
          
          if (!filePath) {
            for (const key in scene) {
              const val = scene[key];
              if (typeof val === 'string' && (val.startsWith('http') || val.includes('.jpg') || val.includes('.png') || val.includes('.webp') || val.includes('/'))) {
                if (key !== 'id' && key !== 'tour_id' && key !== 'title' && key !== 'name') {
                  filePath = val;
                  break;
                }
              }
            }
          }

          let panoramaUrl = '';
          if (filePath && filePath.startsWith('http')) {
            panoramaUrl = filePath;
          } else if (filePath) {
            const { data: publicURLData } = supabaseClient
              .storage
              .from(STORAGE_BUCKET)
              .getPublicUrl(filePath);
            panoramaUrl = publicURLData.publicUrl;
          }

          // Build hotspots array for this scene
          let sceneHotspots = [];
          
          // Map walkthrough connections if stored in the walkthroughs table
          const relatedHotspots = walkthroughsData.filter(w => w.scene_id === scene.id || w.from_scene_id === scene.id);
          relatedHotspots.forEach(spot => {
            sceneHotspots.push({
              "pitch": spot.pitch || 0,
              "yaw": spot.yaw || 0,
              "type": "scene",
              "text": spot.title || spot.text || "Next Room",
              "sceneId": spot.target_scene_id || spot.to_scene_id
            });
          });

          pannellumScenes[sceneKey] = {
            "title": scene.title || scene.name || `Scene ${index + 1}`,
            "type": "equirectangular",
            "panorama": panoramaUrl,
            "autoLoad": true,
            "hotSpots": sceneHotspots
          };
        });

        // 5. Initialize Pannellum Multi-Scene Viewer
        pannellum.viewer('panorama-container', {
          "default": {
            "firstScene": firstSceneId,
            "autoRotate": -2,
            "showZoomCtrl": true,
            "showFullscreenCtrl": true,
            "author": tourData.author || "Panosphere Studio"
          },
          "scenes": pannellumScenes
        });

      } catch (err) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorMessage.innerText = `Error loading tour: ${err.message}`;
        errorMessage.style.display = 'block';
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadTour);
  </script>
</body>
</html>
